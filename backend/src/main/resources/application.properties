# ========================================================
# Configuración del Servidor Spring Boot
# ========================================================
server.port=8082

# ========================================================
# Conexión MySQL - gamescore_db
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/gamescore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# Configuración JPA / Hibernate
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================================
# Nombre de la Aplicación
# ========================================================
spring.application.name=gamescore-api
